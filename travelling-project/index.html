<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Travelling App</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <header class="site-header sticky-top">
       <nav class="navbar navbar-expand-lg">
          <div class="container">
            <a class="navbar-brand brand d-flex align-items-center gap-2" href="#" data-view="explore">
              <span class="brand-icon"><i class="bi bi-compass-fill"></i></span>
              <span>LOKAM</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button><!--for mobile-->  
            <div class="collapse navbar-collapse">
               <div class="nav nav-pills mx-lg-auto my-3 my-lg-0" role="tablist" aria-label="Main navigation">
                  <button class="nav-link active" data-view="explore" type="button">Explore</button>
                  <button class="nav-link" data-view="bookmarks" type="button">Saved (<span id="bookmark-count">0</span>)</button>
                  <button class="nav-link" data-view="itinerary" type="button">My Itinerary</button>
               </div>
               <div class="d-flex align-items-center gap-3">
                 <span class="credit-pill d-none d-sm-inline-flex"><i class="bi bi-wallet2"></i> $4,250 Credit</span>
                 <img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="User profile">
                </div>
             </div>
          </div>
       </div>
    </nav>
 </header>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
   <script src="script.js"></script>
</body>
</html>
