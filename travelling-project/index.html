<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Travelling App</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <header class="site-header sticky-top">
       <nav class="navbar navbar-expand-lg">
          <div class="container">
            <a class="navbar-brand brand d-flex align-items-center gap-2" href="#explore" data-view="explore">
              <span class="brand-icon"><i class="bi bi-compass-fill"></i></span>
              <span>LOKAM</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button><!--for mobile-->  
            <div class="collapse navbar-collapse">
               <div class="nav nav-pills mx-lg-auto my-3 my-lg-0" role="tablist" aria-label="Main navigation" id="mainnav">
                  <button class="nav-link active" data-view="explore" type="button">Explore</button>
                  <button class="nav-link" data-view="bookmarks" type="button">Saved (<span id="bookmark-count">0</span>)</button>
                  <button class="nav-link" data-view="itinerary" type="button">My Itinerary</button>
               </div>
               <div class="d-flex align-items-center gap-3">
                 <span class="credit-pill d-none d-sm-inline-flex"><i class="bi bi-wallet2"></i> $4,250 Credit</span>
                 <img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="User profile">
                </div>
             </div>
          </div>
       </div>
    </nav>
 </header>
 <main class="container py-4 py-lg-5">
   <section id="view-explore" class="app-view">
      <div class="hero-banner">
         <div class="hero-shade"></div>
         <div class="hero-content">
            <span class="eyebrow"><i class="bi bi-stars"></i> Dicover your next adventure</span>
            <h1>Where do you want <br class="d-none d-sm-block">to wander next?</h1>
            <p> Explore unforgettable Destinations, hidden escapes, and beautiful places around the world.</p>
            <div class="search-panel row g-2">
               <div class="col-12 col-md">
                  <div class="search-input-wrap">
                     <i class="bi bi-search"></i><!--search icon-->
                     <input type="search"id="search-input" class="form-control" placeholder="Search destinations,cities, or experiences">
                  </div>
               </div>
               <div class="col-12 col-md-4">
                  <select class="form-select" aria-label="Filter by category">
                     <option value="all">All Categories</option>
                     <option value="Beach">Beaches & Island</option>
                     <option value="Mountain">Mountain & Nature</option>
                     <option value="City">City & Culture</option>
                     <option value="Adventure">Adventure</option>
                  </select>
               </div>
            </div>
         </div>
      </div>
      <div class="category-list d-flex gap-2 overflow-auto py-4">
         <button class="category-chip active" data-category="all">🌍 All Places</button>
         <button class="category-chip" data-category="Beach">🏖️ Beaches & Islands</button>
         <button class="category-chip" data-category="Mountain">⛰️ Mountains & Nature</button>
         <button class="category-chip" data-category="City">🏙️ Cities & Culture</button>
         <button class="category-chip" data-category="Adventure">🧗 Adventure</button>
      </div>
      <div class="mb-3">
         <h2 class="section-title mb-1">Featured Trips <span class="count-label" id="destination-count">0</span></h2> 
         <p class="section-subtitle mb-0">Find a place feels like you</p>
      </div>
      <div id="destinations-grid" class="row g-4"></div>
   </section>

 </main>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
   <script src="script.js"></script>
</body>
</html>
